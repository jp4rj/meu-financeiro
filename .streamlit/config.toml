[theme]
base = "light"
primaryColor = "#1F6F8B"
backgroundColor = "#E8EEF3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A2B34"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Tenta reconectar automaticamente quando a conexão cai
reconnectAttempts = 10
reconnectDelay = 1000
